<!doctype html>
<!--
  Görünüm varsayılanları statik olarak buradadır (yüksek kontrast + Inter
  arayüz fontu). React mount olup `App.tsx` store değerlerini yazana kadar
  oluşacak "normal palet + monospace" yanıp sönmesini (FOUC) önler.
  Persist edilmiş bir kullanıcı tercihi varsa App.tsx bunları ezer.
-->
<html lang="tr" data-contrast="high" data-uifont="inter">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MacroCode</title>
    <link rel="icon" type="image/svg+xml" href="/macrocode-logo.svg" />
    <!-- Fontlar yerel olarak paketlenir (public/fonts) — çalışma anında ağ isteği yok. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
