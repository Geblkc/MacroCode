[package]
name = "macrocode"
version = "1.2.0"
description = "MacroCode — AI terminal desktop app"
authors = ["Gökhan Efe Balıkçı"]
license = "GPL-2.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "macrocode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# tauri-plugin-sql'in kullandığı SQLite havuzunda atomik transaction yazmak için.
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
tauri-plugin-dialog = "2"  # klasör seçme diyaloğu (tauri-apps/api/plugin-dialog JS tarafı)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
glob = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls-manual-roots", "rustls-tls-native-roots", "json"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "process", "time", "io-util", "sync"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"

# API anahtarları işletim sistemi anahtar zincirinde saklanır (BYOK).
# Her platform yalnızca kendi native deposunu derler; `keys.json` geri dönüşüm.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

# P0.2 — iptal/timeout'ta süreç AĞACINI sonlandırma (yalnız doğrudan child değil).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Faz 4: release derlemesinde daha küçük ve daha hızlı ikili. `panic = "abort"`
# bazı bağımlılıklarda unwinding beklediği için bilinçli olarak kullanılmıyor.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false
