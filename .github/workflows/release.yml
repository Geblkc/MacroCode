# MacroCode — sürüm dağıtımı.
#
# `vX.Y.Z` tag'i push edildiğinde (veya elle tetiklendiğinde):
#   • linux  → .deb + .rpm + .AppImage  (ubuntu-22.04, eski glibc ile uyumlu)
#   • windows → NSIS .exe + .msi
# Paketler toplanır, SHA256SUMS üretilir ve GitHub Release'e yüklenir.
# Sürüm bump'ı için: bash scripts/release.sh X.Y.Z

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (deb · rpm · AppImage)
    runs-on: ubuntu-22.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: Tauri sistem bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev \
            libgtk-3-dev librsvg2-dev libfuse2 libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Testler
        run: |
          npx tsc --noEmit
          npm test
          # generate_context! `frontendDist: ../dist` ister — cargo test öncesi dist derlenmeli.
          npm run build
          cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Paketleri derle
        run: npm run tauri build -- --bundles deb,rpm,appimage

      - name: Topla
        run: |
          mkdir -p bundles
          cp src-tauri/target/release/bundle/deb/*.deb      bundles/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/rpm/*.rpm      bundles/ 2>/dev/null || true
          # `.sig` dosyaları da alınır (updater latest.json için gerekli).
          cp src-tauri/target/release/bundle/appimage/*     bundles/ 2>/dev/null || true
          ls -lh bundles

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: bundles/
          if-no-files-found: error

  windows:
    name: Windows (NSIS .exe · .msi)
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Testler
        run: |
          npx tsc --noEmit
          npm test
          npm run build
          cargo test --lib --manifest-path src-tauri/Cargo.toml

      # Authenticode: OV/EV sertifikası `WINDOWS_CERTIFICATE_BASE64` secret'ı
      # olarak tanımlıysa içe aktarılır; yoksa adım atlanır (imzasız build).
      - name: Kod imzalama sertifikasını içe aktar
        id: cert
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx -Force
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Paketleri derle
        shell: pwsh
        env:
          WIN_CERT_THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
        run: |
          $extra = @()
          if ($env:WIN_CERT_THUMBPRINT) {
            $cfg = @{
              bundle = @{
                windows = @{
                  certificateThumbprint = $env:WIN_CERT_THUMBPRINT
                  digestAlgorithm       = 'sha256'
                  timestampUrl          = 'http://timestamp.digicert.com'
                }
              }
            } | ConvertTo-Json -Depth 6
            $cfgPath = Join-Path $env:RUNNER_TEMP 'signing.json'
            Set-Content -Path $cfgPath -Value $cfg -Encoding utf8
            $extra = @('--config', $cfgPath)
          }
          npm run tauri build -- --bundles nsis,msi @extra

      - name: Topla
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundles | Out-Null
          # `.sig` dosyaları da alınır (updater latest.json için gerekli).
          Copy-Item src-tauri/target/release/bundle/nsis/* bundles/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/release/bundle/msi/*  bundles/ -ErrorAction SilentlyContinue
          Get-ChildItem bundles

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: bundles/
          if-no-files-found: error

  macos:
    name: macOS (dmg · app)
    runs-on: macos-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: npm ci

      - name: Testler
        run: |
          npx tsc --noEmit
          npm test
          npm run build

      # Apple imza bilgileri yalnızca gerçekten tanımlıysa ortama yazılır.
      # Boş bir `APPLE_CERTIFICATE` değişkeni Tauri tarafından "sertifika var"
      # sanılıp keychain'e boş .p12 aktarılmaya çalışılıyor ve macOS build
      # `SecKeychainItemImport ... not valid` hatasıyla düşüyordu.
      - name: Apple kimlik bilgilerini hazırla
        env:
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERTIFICATE_SECRET:-}" ]; then
            {
              echo 'APPLE_CERTIFICATE<<__APPLE_CERT__'
              echo "$APPLE_CERTIFICATE_SECRET"
              echo '__APPLE_CERT__'
            } >> "$GITHUB_ENV"
          fi
          set_var() {
            if [ -n "${2:-}" ]; then
              printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"
            fi
          }
          set_var APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD_SECRET"
          set_var APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY_SECRET"
          set_var APPLE_ID "$APPLE_ID_SECRET"
          set_var APPLE_PASSWORD "$APPLE_PASSWORD_SECRET"
          set_var APPLE_TEAM_ID "$APPLE_TEAM_ID_SECRET"

      # Developer ID sertifikası `APPLE_CERTIFICATE` (base64 .p12) olarak
      # tanımlıysa keychain'e yüklenir. Tanımlı değilse build imzasız çıkar.
      - name: Apple sertifikasını içe aktar
        if: env.APPLE_CERTIFICATE != ''
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions build.keychain
          rm -f certificate.p12

      - name: Paketleri derle (universal)
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg,app

      - name: Topla
        run: |
          mkdir -p bundles
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg bundles/ 2>/dev/null || true
          # Updater için .app.tar.gz + .sig (Tauri üretir).
          cp src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz bundles/ 2>/dev/null || true
          cp src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig bundles/ 2>/dev/null || true
          ls -lh bundles

      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: bundles/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [linux, windows, macos]
    # Yalnızca `v*` tag push'unda yayınla (workflow_dispatch'ta da bir tag
    # seçilerek çalıştırılmalı — "Use workflow from" → tag).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Updater latest.json
        working-directory: bundles
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          APPIMAGE="$(ls MacroCode_*_amd64.AppImage | head -n1)"
          EXE="$(ls *-setup.exe | head -n1)"
          MAC_TGZ="$(ls *universal.app.tar.gz 2>/dev/null | head -n1 || ls *.app.tar.gz | head -n1)"
          # Tauri imza dosyaları indirilen artifact'ların içinde gelir.
          APPIMAGE_SIG="$(cat "${APPIMAGE}.sig")"
          EXE_SIG="$(cat "${EXE}.sig")"
          MAC_SIG="$(cat "${MAC_TGZ}.sig")"

          # Sürüm notları: depoda izlenen docs/releases/vX.Y.Z.md dosyası.
          NOTES_FILE="../docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "${NOTES_FILE}" ]; then
            NOTES="$(cat "${NOTES_FILE}")"
          else
            NOTES="MacroCode ${GITHUB_REF_NAME}"
          fi

          jq -n \
            --arg version "${VERSION}" \
            --arg notes "${NOTES}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg appimage_url "${BASE}/${APPIMAGE}" \
            --arg appimage_sig "${APPIMAGE_SIG}" \
            --arg exe_url "${BASE}/${EXE}" \
            --arg exe_sig "${EXE_SIG}" \
            --arg mac_url "${BASE}/${MAC_TGZ}" \
            --arg mac_sig "${MAC_SIG}" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "linux-x86_64": { signature: $appimage_sig, url: $appimage_url },
                "windows-x86_64": { signature: $exe_sig, url: $exe_url },
                "darwin-x86_64": { signature: $mac_sig, url: $mac_url },
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url }
              }
            }' > latest.json
          cat latest.json

      - name: SHA256SUMS
        working-directory: bundles
        run: |
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MacroCode ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            bundles/*
